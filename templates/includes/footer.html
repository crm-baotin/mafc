<script>
const btn = document.querySelector('.mobile-menu-btn');
const menu = document.querySelector('.mobile-menu');

btn.addEventListener('click', function(e) {
  e.stopPropagation();

  menu.classList.toggle('active');
  btn.classList.toggle('active');
});

// click trong menu → không đóng
menu.addEventListener('click', function(e) {
  e.stopPropagation();
});

// click ngoài → đóng
document.addEventListener('click', function(e) {
  if (!menu.contains(e.target) && !btn.contains(e.target)) {
    menu.classList.remove('active');
    btn.classList.remove('active');
  }
});
</script>


<script>
function fixMenuPosition() {
  const header = document.querySelector('.header');
  const menu = document.querySelector('.mobile-menu');

  if (header && menu) {
    const h = header.offsetHeight;
    menu.style.top = h + 'px';
  }
}

// chạy lần đầu
fixMenuPosition();

// chạy khi resize
window.addEventListener('resize', fixMenuPosition);
</script>


<script>
function fixLayout() {
  const header = document.querySelector('.header');
  const menu = document.querySelector('.menu');

  let totalHeight = 0;

  if (header) totalHeight += header.offsetHeight;

  // 👉 chỉ cộng menu khi nó HIỆN (PC)
  if (menu && window.innerWidth > 768) {
    totalHeight += menu.offsetHeight;
  }

  document.body.style.paddingTop = totalHeight + 'px';
}

fixLayout();
window.addEventListener('resize', fixLayout);
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {
  let slides = document.querySelectorAll('.slider .slide');
  let index = 0;

  if (slides.length > 0) {
    setInterval(() => {
      slides[index].classList.remove('active');
      index = (index + 1) % slides.length;
      slides[index].classList.add('active');
    }, 4500);
  }
});
</script>

<script>
document.querySelectorAll('.tab').forEach((tab, index) => {

    document.querySelectorAll('.tab').forEach(t => t.classList.remove('active'));
    tab.classList.add('active');

    // demo đơn giản (chưa đổi nội dung)
  });
});
</script>

<script>
document.addEventListener("DOMContentLoaded", function () {

  document.querySelectorAll('.dropdown > a').forEach(btn => {

    btn.addEventListener('click', function(e) {

      e.preventDefault(); // chỉ chặn nút cha

      const parent = this.parentElement;
      const submenu = parent.querySelector('.submenu');

      // đóng menu khác
      document.querySelectorAll('.submenu').forEach(m => {
        if (m !== submenu) m.classList.remove('active');
      });

      submenu.classList.toggle('active');
      parent.classList.toggle('active');

    });

  });

});
document.addEventListener("click", function (e) {
  const menu = document.querySelector('.menu');

  if (!menu.contains(e.target)) {
    // đóng tất cả submenu
    document.querySelectorAll('.submenu').forEach(sub => {
      sub.classList.remove('active');
    });

    document.querySelectorAll('.dropdown').forEach(drop => {
      drop.classList.remove('active');
    });
  }
});
</script>

<script>
document.querySelectorAll('.m-btn').forEach(btn => {

  btn.addEventListener('click', function(e) {

    e.preventDefault();

    const parent = this.parentElement;
    const submenu = this.nextElementSibling;

    // đóng menu khác
    document.querySelectorAll('.m-submenu').forEach(m => {
      if (m !== submenu) {
        m.style.height = 0;
        m.parentElement.classList.remove('active');
      }
    });

    // toggle
    if (submenu.style.height && submenu.style.height !== "0px") {
      submenu.style.height = 0;
      parent.classList.remove('active');
    } else {
      submenu.style.height = submenu.scrollHeight + "px";
      parent.classList.add('active');
    }

  });

});
</script>


<script>
document.querySelectorAll('.slider-wrapper.auto-slide').forEach(wrapper => {

  const track = wrapper.querySelector('.slider-track');
  let items = Array.from(wrapper.querySelectorAll('.loan-item'));

  // clone để loop
  items.forEach(item => {
    track.appendChild(item.cloneNode(true));
  });

  let index = 0;

  function getItemWidth() {
    return items[0].getBoundingClientRect().width +
           parseFloat(getComputedStyle(track).gap);
  }

  function slide() {
    let itemWidth = getItemWidth();

    index++;

    track.style.transition = "transform 0.5s ease";
    track.style.transform = `translate3d(-${index * itemWidth}px,0,0)`;

    if (index >= items.length) {
      track.style.transition = "none";
      index = 0;
      track.style.transform = `translate3d(0,0,0)`;
    }
  }

  setInterval(slide, 4500);

});
</script>


<script>
document.querySelectorAll(".tab").forEach(btn => {
  btn.addEventListener("click", () => {

    document.querySelectorAll(".tab").forEach(t => t.classList.remove("active"));
    document.querySelectorAll(".tab-content").forEach(c => c.classList.remove("active"));

    btn.classList.add("active");

    const id = btn.getAttribute("data-tab");
    document.getElementById(id).classList.add("active");
  });
});
</script>
